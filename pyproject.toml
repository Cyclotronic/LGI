[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lgi-inventory"
version = "1.0.1"
description = "LAN GPIB Inventory - VXI-11 instrument scanner and inventory database with Tkinter GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Cyclotronic", email = "crimp@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
lgi = "lgi:main"
lgi-core = "lgi_core:main"
fake-gateway = "fake_gateway:main"

[tool.setuptools]
py-modules = ["lgi", "lgi_core", "lgi_testcontroller", "fake_gateway"]
